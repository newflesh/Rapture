# Reverse-proxy snippet for IBM HTTP Server (Apache) on IBM i 7.5.
#
# Forwards /api/* to the Rapture Node.js engine running locally in PASE.
# Apache stays the public front door (SSL termination, virtual hosts, ACLs);
# Rapture only needs to be reachable on localhost.
#
# Install:
#   1. Append this file's contents to your HTTP server instance's config,
#      e.g. /www/<instance>/conf/httpd.conf (edit via ADMIN2's HTTP Server
#      Administration GUI, or directly in the IFS with a text editor).
#   2. Make sure these modules are loaded earlier in httpd.conf (usually
#      already present in the default IBM i config; add if missing):
#        LoadModule proxy_module        /QSYS.LIB/QHTTPSVR.LIB/QZSRVPXY.SRVPGM
#        LoadModule proxy_http_module   /QSYS.LIB/QHTTPSVR.LIB/QZSRVPXY.SRVPGM
#   3. Restart the HTTP server instance:
#        ENDTCPSVR SERVER(*HTTP) HTTPSVR(<instance>)
#        STRTCPSVR SERVER(*HTTP) HTTPSVR(<instance>)
#
# Adjust RAPTURE_PORT to match PORT in the Rapture environment (default 3000).

ProxyRequests Off
ProxyPreserveHost On

<Location /api/>
    ProxyPass        http://127.0.0.1:3000/api/
    ProxyPassReverse http://127.0.0.1:3000/api/
</Location>
